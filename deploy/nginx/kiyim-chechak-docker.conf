# Host Nginx — proxies public domain to frontend Docker container on localhost:8080
# Frontend container Nginx serves the SPA and proxies /api -> backend container
#
# Install:
#   sudo cp deploy/nginx/kiyim-chechak-docker.conf /etc/nginx/sites-available/kiyim-chechak
#   sudo ln -sf /etc/nginx/sites-available/kiyim-chechak /etc/nginx/sites-enabled/kiyim-chechak
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t
#   sudo systemctl enable nginx
#   sudo systemctl restart nginx
#
# SSL (one-time):
#   sudo certbot --nginx -d kiyim-kechak.kahoot.uz

server {
    listen 80;
    listen [::]:80;
    server_name kiyim-kechak.kahoot.uz;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
